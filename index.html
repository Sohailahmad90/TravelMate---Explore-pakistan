<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TravelMate — Smart Tourism &amp; Trip Planning</title>
    <meta name="description" content="AI-powered smart tourism, trip planning, verified local services, and safety platform for Pakistan." />
    <meta property="og:title" content="TravelMate — Smart Tourism &amp; Trip Planning" />
    <meta property="og:description" content="AI-powered smart tourism, trip planning, verified local services, and safety platform for Pakistan." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#F4F7FC] text-[#0F172A] antialiased selection:bg-[#EEF4FF] selection:text-[#0D5EFF]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('DOMContentLoaded', function () {
        setTimeout(function () {
          var root = document.getElementById('root');
          var rawEntry = document.querySelector('script[src="/src/main.tsx"]');
          if (root && !root.hasChildNodes() && rawEntry && location.hostname.endsWith('github.io')) {
            root.innerHTML =
              '<div style="font-family:system-ui,sans-serif;max-width:560px;margin:64px auto;padding:24px;background:#fff;border:1px solid #e2e8f0;border-radius:16px;color:#0f172a">' +
              '<h1 style="font-size:18px;font-weight:700;margin:0 0 8px">TravelMate needs its GitHub Actions build</h1>' +
              '<p style="font-size:14px;line-height:1.6;color:#475569;margin:0">GitHub Pages is serving unbuilt source files from the branch root. Go to <strong>Repository Settings &rarr; Pages &rarr; Source</strong> and select <strong>GitHub Actions</strong>, then re-run the workflow.</p>' +
              '</div>';
          }
        }, 2500);
      });
    </script>
  </body>
</html>
